# The operator's gateway chain — box-level, started ONCE per host.
#
#   docker compose -f compose.gateway.yaml up -d
#
# `shitproxy` (a caching/routing proxy) and `gateway` (a Caddy front door for it)
# are shared infrastructure. Every Claudesk deployment on the host reaches them
# over the external `gateway_net`, so a second deployment must NOT start another
# copy — it just depends on this one running. That is what lets two deployments
# coexist without fighting over container names or the host port.
#
# The socat relays that expose the gateway inside each deployment's Desktop /
# mobile network namespace are NOT here: they follow those services, so they live
# in compose.yaml and are prefixed per deployment.

services:
  # Local caching/routing proxy in front of the upstream provider. Built from its
  # own private project; referenced here by an image, never a build context, so
  # nothing here builds or publishes it. Set SHITPROXY_IMAGE (in .env, or the
  # shell) to whatever this host tags it as.
  shitproxy:
    image: ${SHITPROXY_IMAGE:-local/shitproxy:latest}
    container_name: shitproxy
    restart: unless-stopped
    env_file:
      - /etc/shitproxy/gateway.env
    environment:
      HOST: "0.0.0.0"
      PORT: "4000"
    ports:
      - "127.0.0.1:${SHITPROXY_PORT:-14000}:4000"
    # On gateway_net so it can resolve `authd` for per-user key resolution
    # (UPSTREAM_KEY_RESOLVER_URL): each deployment's authd is reachable there by
    # name. The Caddy front door below shares the network, so it still reaches
    # shitproxy as before.
    networks:
      - gateway_net
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # TLS front door for the proxy, with the gateway routes in its Caddyfile.
  gateway:
    image: caddy:2
    container_name: gateway
    restart: unless-stopped
    networks:
      - default
      - gateway_net
    env_file:
      - /etc/litellm/litellm.env
    volumes:
      - /etc/litellm/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - shitproxy

networks:
  gateway_net:
    external: true
