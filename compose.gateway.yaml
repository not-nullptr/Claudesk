# Merge this on top of compose.yaml for a deployment that reaches the box-level
# inference gateway:
#
#   docker compose -f compose.yaml -f compose.gateway.yaml up -d
#
# The gateway chain itself (`shitproxy` + the caddy `gateway`) is **box-level**:
# it belongs to whichever stack owns it and is reached over gateway_net. It used
# to be declared here as well, which is how this file came to fight that stack
# for the fixed container names `shitproxy` and `gateway` — two stacks cannot own
# one container name, so a deployment that merged this file could take the box's
# routing away from every other deployment on the machine (the running containers
# keep running when the declarations go, but never start them from here).
#
# What is left is per-deployment: the host-gateway entry, and the loopback relays
# that expose the box gateway as 127.0.0.1:4000 inside this deployment's Desktop
# and mobile network namespaces. The Desktop's applied inference config points at
# `http://127.0.0.1:4000`, so those relays are load-bearing; they reach the box
# gateway by name over gateway_net.

services:
  # Reach the host from inside the Desktop/mobile network namespaces.
  claude-desktop:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Expose the box gateway on 127.0.0.1:4000 inside the Desktop / mobile network
  # namespace, so each service's CLAUDE_GATEWAY_BASE_URL can be a loopback URL.
  claude-gateway-loopback:
    image: alpine/socat
    container_name: claude-gateway-loopback
    restart: unless-stopped
    network_mode: "service:claude-desktop"
    depends_on:
      - claude-desktop
    command:
      - "TCP-LISTEN:4000,bind=127.0.0.1,reuseaddr,fork"
      - "TCP:gateway:4000"

  claude-mobile-gateway-loopback:
    image: alpine/socat
    container_name: claude-mobile-gateway-loopback
    restart: unless-stopped
    network_mode: "service:claude-mobile"
    depends_on:
      - claude-mobile
    command:
      - "TCP-LISTEN:4000,bind=127.0.0.1,reuseaddr,fork"
      - "TCP:gateway:4000"
