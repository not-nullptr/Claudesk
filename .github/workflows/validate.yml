name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  renderer-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix rootfs/opt/claude-cowork-bridge --omit=dev --ignore-scripts --no-audit --no-fund
      - run: node scripts/renderer-runtime-smoke.mjs

  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Validate source and configuration
        run: |
          npm ci --prefix rootfs/opt/claude-cowork-bridge --ignore-scripts --no-audit --no-fund
          ./scripts/validate.sh
