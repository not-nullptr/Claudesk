services:
  claude-desktop:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CLAUDE_DESKTOP_VERSION: "${CLAUDE_DESKTOP_VERSION:-2.9939.4}"
    image: local/claude-desktop-nas:official-linux
    container_name: claude-desktop
    hostname: claude-desktop
    ports:
      - "${COWORK_WEB_PORT:-15821}:8080"
    extra_hosts:
      - "fn-i3h510-1.tail0292a9.ts.net:100.102.63.126"
    env_file:
      - .env
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      USER_ID: "${PUID:-1000}"
      GROUP_ID: "${PGID:-1001}"
      SUP_GROUP_IDS: "${KVM_GID:-104}"
      DISPLAY_WIDTH: "${DISPLAY_WIDTH:-1280}"
      DISPLAY_HEIGHT: "${DISPLAY_HEIGHT:-720}"
      WEB_AUDIO: "0"
      SECURE_CONNECTION: "0"
      WEB_AUTHENTICATION: "0"
      VNC_LOCALHOST_ONLY: "1"
      KEEP_APP_RUNNING: "1"
      CLAUDE_HEADLESS: "${CLAUDE_HEADLESS:-1}"
      CLAUDE_DISABLE_GPU: "${CLAUDE_DISABLE_GPU:-1}"
      CLAUDE_COWORK_VM_MEMORY_GB: "${CLAUDE_COWORK_VM_MEMORY_GB:-2}"
      CLAUDE_COWORK_VM_CPU_COUNT: "${CLAUDE_COWORK_VM_CPU_COUNT:-1}"
      CLAUDE_COWORK_VM_IDLE_MINUTES: "${CLAUDE_COWORK_VM_IDLE_MINUTES:-30}"
      CLAUDE_COWORK_VM_SCHEDULE_GUARD_MINUTES: "${CLAUDE_COWORK_VM_SCHEDULE_GUARD_MINUTES:-10}"
      CLAUDE_COWORK_HOST_BASH: "${CLAUDE_COWORK_HOST_BASH:-0}"
      COWORK_BRIDGE_ENABLED: "${COWORK_BRIDGE_ENABLED:-1}"
      COWORK_BRIDGE_INTERNAL_PORT: "${COWORK_BRIDGE_INTERNAL_PORT:-9222}"
      CLAUDE_REMOTE_GATEWAY_SETTINGS: "${CLAUDE_REMOTE_GATEWAY_SETTINGS:-0}"
      CLAUDE_REMOTE_DEVELOPER_ACTIONS: "${CLAUDE_REMOTE_DEVELOPER_ACTIONS:-0}"
      CLAUDE_REMOTE_INFRASTRUCTURE_ACTIONS: "${CLAUDE_REMOTE_INFRASTRUCTURE_ACTIONS:-0}"
      CLAUDE_REMOTE_CODE_ACTIONS: "${CLAUDE_REMOTE_CODE_ACTIONS:-1}"
      # Read by the renderer preparer (cont-init) as well as the bridge: with the
      # web shell on it also splices the desktop Code route alias. See
      # docs/web-shell.md.
      CLAUDE_REMOTE_WEB_SHELL: "${CLAUDE_REMOTE_WEB_SHELL:-0}"
      CLAUDE_GATEWAY_BASE_URL: "${CLAUDE_GATEWAY_BASE_URL:?Set CLAUDE_GATEWAY_BASE_URL in .env}"
      CLAUDE_GATEWAY_API_KEY: "${CLAUDE_GATEWAY_API_KEY:?Set CLAUDE_GATEWAY_API_KEY in .env}"
      CLAUDE_GATEWAY_AUTH_SCHEME: "${CLAUDE_GATEWAY_AUTH_SCHEME:-bearer}"
      CLAUDE_INFERENCE_MODELS_JSON: "${CLAUDE_INFERENCE_MODELS_JSON:?Set CLAUDE_INFERENCE_MODELS_JSON in .env}"
      # Model Auto permission mode's safety classifier falls back to on this
      # gateway (exported as ANTHROPIC_DEFAULT_OPUS_MODEL by startapp.sh). A
      # model the gateway serves; empty keeps the built-in resolution. See
      # .env.example.
      CLAUDE_AUTO_MODE_MODEL: "${CLAUDE_AUTO_MODE_MODEL:-}"
    volumes:
      - /vol2/1000/Docker/ClaudeDesktop/config:/config
      - /vol2/1000/Docker/ClaudeDesktop/workspace:/workspace
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/vhost-vsock:/dev/vhost-vsock
    group_add:
      - "${KVM_GID:-104}"
    security_opt:
      - "seccomp=./security/claude-desktop.json"
    shm_size: "2gb"
    mem_limit: "${CLAUDE_DESKTOP_MEMORY_LIMIT:-3g}"
    networks:
      - gateway_net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pgrep -f '/usr/bin/claude-desktop|claude-desktop' >/dev/null
          && curl -fsS --max-time 5 http://127.0.0.1:${COWORK_BRIDGE_INTERNAL_PORT:-9222}/health >/dev/null
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  cowork-bridge:
    build:
      context: .
      dockerfile: bridge/Dockerfile
    image: local/claude-cowork-bridge:latest
    container_name: claude-cowork-bridge
    # Browser uploads are written under /workspace and must be readable by the
    # Desktop/Code processes, which run as PUID:PGID.
    user: "${PUID:-1000}:${PGID:-1001}"
    network_mode: "service:claude-desktop"
    depends_on:
      claude-desktop:
        condition: service_healthy
        restart: true
      office-preview:
        condition: service_started
    environment:
      BRIDGE_HOST: "0.0.0.0"
      BRIDGE_PORT: "8080"
      COWORK_INTERNAL_URL: "http://127.0.0.1:${COWORK_BRIDGE_INTERNAL_PORT:-9222}"
      CLAUDE_REMOTE_GATEWAY_SETTINGS: "${CLAUDE_REMOTE_GATEWAY_SETTINGS:-0}"
      CLAUDE_REMOTE_DEVELOPER_ACTIONS: "${CLAUDE_REMOTE_DEVELOPER_ACTIONS:-0}"
      CLAUDE_REMOTE_INFRASTRUCTURE_ACTIONS: "${CLAUDE_REMOTE_INFRASTRUCTURE_ACTIONS:-0}"
      CLAUDE_REMOTE_CODE_ACTIONS: "${CLAUDE_REMOTE_CODE_ACTIONS:-1}"
      # Experimental: render ion-dist's browser (claude.ai) chrome with the local
      # IPC data layer, and grant the org entitlements its Cowork surface checks.
      # See docs/web-shell.md. Off by default.
      CLAUDE_REMOTE_WEB_SHELL: "${CLAUDE_REMOTE_WEB_SHELL:-0}"
      # Display name for the signed-in user in the remote UI (the sidebar user
      # menu and the time-based home greeting). Empty keeps Desktop's own value.
      CLAUDE_REMOTE_USER_NAME: "${CLAUDE_REMOTE_USER_NAME:-}"
      # Model the title generator is asked to use. Empty falls back to the
      # session's own model; set it to a cheap model the gateway serves.
      CLAUDE_TITLE_MODEL: "${CLAUDE_TITLE_MODEL:-}"
      COWORK_REMOTE_WORKSPACE_ROOT: "/workspace"
      # Extra roots (colon- or comma-separated) the authenticated remote
      # download route may serve from, on top of the always-allowed workspace.
      # Paths are resolved inside this container, so a host directory also
      # needs a bind mount above to exist here. Empty means /workspace only.
      COWORK_REMOTE_READ_ROOTS: "${COWORK_REMOTE_READ_ROOTS:-}"
      # Largest file the bridge will hand the session file pane when Desktop's
      # own reader refuses it (Desktop caps at 10 MiB). Default 10485760.
      COWORK_REMOTE_SESSION_FILE_MAX_BYTES: "${COWORK_REMOTE_SESSION_FILE_MAX_BYTES:-10485760}"
      COWORK_UPLOAD_MAX_BYTES: "${COWORK_UPLOAD_MAX_BYTES:-1073741824}"
      # Office/PDF file preview: the pane's iframe asks the bridge, which streams
      # a PDF converted by the office-preview sidecar (sharing this network
      # namespace). Largest file the bridge will convert for preview; accepts a
      # K/M/G suffix. Default 52428800 (50 MiB), matching Desktop's own cap.
      CLAUDE_OFFICE_PREVIEW_URL: "http://127.0.0.1:8090"
      COWORK_REMOTE_PREVIEW_MAX_BYTES: "${COWORK_REMOTE_PREVIEW_MAX_BYTES:-52428800}"
      COWORK_REMOTE_ARTIFACTS_ROOT: "/config/Claude/Artifacts"
      COWORK_INTERNAL_FAILURE_EXIT_THRESHOLD: "${COWORK_INTERNAL_FAILURE_EXIT_THRESHOLD:-3}"
      CLAUDE_INFERENCE_MODELS_JSON: "${CLAUDE_INFERENCE_MODELS_JSON:?Set CLAUDE_INFERENCE_MODELS_JSON in .env}"
    volumes:
      - /vol2/1000/Docker/ClaudeDesktop/config:/config:ro
      - /vol2/1000/Docker/ClaudeDesktop/workspace:/workspace
    mem_limit: "${CLAUDE_COWORK_BRIDGE_MEMORY_LIMIT:-256m}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Office/PDF preview converter. LibreOffice is the engine Desktop uses for the
  # same previews (it runs soffice in the Cowork VM). It is kept out of the
  # bridge so a heavy, occasionally crashy conversion cannot take down the
  # process that also serves Chat and Cowork IPC, and so the bridge keeps its
  # tight memory bound. It only ever receives bytes on a POST body and returns a
  # PDF — it has no access to /workspace or /config.
  office-preview:
    build:
      context: .
      dockerfile: bridge/office/Dockerfile
    image: local/claude-office-preview:latest
    container_name: claude-office-preview
    # Shares the Desktop/bridge network namespace, so the bridge reaches it at
    # 127.0.0.1:8090 and it is never exposed on a host port.
    network_mode: "service:claude-desktop"
    depends_on:
      claude-desktop:
        condition: service_healthy
        restart: true
    environment:
      OFFICE_PREVIEW_HOST: "127.0.0.1"
      OFFICE_PREVIEW_PORT: "8090"
      OFFICE_PREVIEW_MAX_BYTES: "${COWORK_REMOTE_PREVIEW_MAX_BYTES:-52428800}"
    mem_limit: "${CLAUDE_OFFICE_PREVIEW_MEMORY_LIMIT:-1g}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  claude-mobile:
    build:
      context: .
      dockerfile: mobile/Dockerfile
    image: local/claude-mobile-api:latest
    container_name: claude-mobile-api
    user: "${PUID:-1000}:${PGID:-1001}"
    ports:
      - "${CLAUDE_MOBILE_PORT:-8081}:8081"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      CLAUDE_MOBILE_HOST: "0.0.0.0"
      CLAUDE_MOBILE_PORT: "8081"
      CLAUDE_MOBILE_DATA_DIR: "/data"
      CLAUDE_MOBILE_API_EMAIL: "${CLAUDE_MOBILE_API_EMAIL:?Set CLAUDE_MOBILE_API_EMAIL in .env}"
      CLAUDE_MOBILE_API_TOTP_SECRET: "${CLAUDE_MOBILE_API_TOTP_SECRET:?Run node mobile/totp-setup.mjs and set CLAUDE_MOBILE_API_TOTP_SECRET in .env}"
      # Reverse proxies in front of this service (Caddy). The client address
      # is read from the matching X-Forwarded-For entry for the login lockout.
      CLAUDE_MOBILE_TRUST_PROXY: "${CLAUDE_MOBILE_TRUST_PROXY:-1}"
      CLAUDE_MOBILE_API_MAX_FAILURES: "${CLAUDE_MOBILE_API_MAX_FAILURES:-5}"
      CLAUDE_MOBILE_API_BASE_BAN_SECONDS: "${CLAUDE_MOBILE_API_BASE_BAN_SECONDS:-600}"
      # Chats, models, uploads and tools all go through Claudesk (the bridge in
      # front of Claude Desktop); this service no longer talks to the gateway.
      CLAUDE_MOBILE_DESKTOP_URL: "${CLAUDE_MOBILE_DESKTOP_URL:-http://claude-desktop:8080}"
      CLAUDE_MOBILE_CAPTURE: "${CLAUDE_MOBILE_CAPTURE:-0}"
      CLAUDE_MOBILE_TOOL_BLOCKS: "${CLAUDE_MOBILE_TOOL_BLOCKS:-1}"
      CLAUDE_MOBILE_THINKING: "${CLAUDE_MOBILE_THINKING:-1}"
      CLAUDE_MOBILE_TITLES: "${CLAUDE_MOBILE_TITLES:-1}"
      # Model the title generator is asked to use. Empty falls back to the
      # session's own model; set it to a cheap model the gateway serves.
      CLAUDE_TITLE_MODEL: "${CLAUDE_TITLE_MODEL:-}"
      CLAUDE_MOBILE_PLAN: "${CLAUDE_MOBILE_PLAN:-max_20x}"
      # One-shot experiment switch for the new-session environment picker:
      # "both" (default) advertises the cloud record and the bridge record;
      # "cloud-only" withholds the bridge so the picker has only the cloud row
      # to offer. Lets one picker open on device tell apart "the picker never
      # surfaces the cloud row" from "it surfaces and then auto-selects/drops
      # it". Unset in normal operation.
      CLAUDE_MOBILE_ENVIRONMENT_MODE: "${CLAUDE_MOBILE_ENVIRONMENT_MODE:-both}"
      # Second half of the same experiment: with the bridge withheld from the
      # list the app still resolves it by id (state persisted on the phone), so
      # setting this to 1 also 404s that by-id read. If the picker then offers
      # the cloud row, the saved bridge id was pinning it.
      CLAUDE_MOBILE_EXPERIMENT_HIDE_BRIDGE_BY_ID: "${CLAUDE_MOBILE_EXPERIMENT_HIDE_BRIDGE_BY_ID:-0}"
      # Shared secret for the on-device Frida probe's findings sink
      # (POST /__diag, see tools/frida/). The route does not exist unless this
      # is set, and it is reached before the login gate so a sideloaded build
      # can report without a session.
      CLAUDE_MOBILE_FRIDA_TOKEN: "${CLAUDE_MOBILE_FRIDA_TOKEN:-}"
    depends_on:
      cowork-bridge:
        condition: service_healthy
    volumes:
      # Login sessions and lockout state, mobile-only chat metadata, uploads, and
      # conversations from before the Claudesk backend (legacy-conversations/).
      - /vol2/1000/Docker/ClaudeDesktop/mobile-data:/data
    mem_limit: "${CLAUDE_MOBILE_API_MEMORY_LIMIT:-256m}"
    networks:
      - gateway_net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

networks:
  gateway_net:
    external: true
