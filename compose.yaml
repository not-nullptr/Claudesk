services:
  claude-desktop:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CLAUDE_DESKTOP_VERSION: "${CLAUDE_DESKTOP_VERSION:-2.31226.1}"
    image: local/claudesk-desktop:official-linux
    container_name: "${CLAUDESK_NAME_PREFIX:-}claude-desktop"
    hostname: claude-desktop
    # The bridge has no application-layer auth, so publish on loopback only; a
    # TLS/Authelia reverse proxy is the intended way in (see README).
    ports:
      - "127.0.0.1:${COWORK_WEB_PORT:-15821}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      USER_ID: "${PUID:-1000}"
      GROUP_ID: "${PGID:-1001}"
      SUP_GROUP_IDS: "${KVM_GID:-104}"
      DISPLAY_WIDTH: "${DISPLAY_WIDTH:-1280}"
      DISPLAY_HEIGHT: "${DISPLAY_HEIGHT:-720}"
      WEB_AUDIO: "0"
      SECURE_CONNECTION: "0"
      WEB_AUTHENTICATION: "0"
      VNC_LOCALHOST_ONLY: "1"
      KEEP_APP_RUNNING: "1"
      CLAUDE_HEADLESS: "${CLAUDE_HEADLESS:-1}"
      CLAUDE_DISABLE_GPU: "${CLAUDE_DISABLE_GPU:-1}"
      CLAUDE_COWORK_VM_MEMORY_GB: "${CLAUDE_COWORK_VM_MEMORY_GB:-2}"
      CLAUDE_COWORK_VM_CPU_COUNT: "${CLAUDE_COWORK_VM_CPU_COUNT:-1}"
      CLAUDE_COWORK_VM_IDLE_MINUTES: "${CLAUDE_COWORK_VM_IDLE_MINUTES:-30}"
      CLAUDE_COWORK_VM_SCHEDULE_GUARD_MINUTES: "${CLAUDE_COWORK_VM_SCHEDULE_GUARD_MINUTES:-10}"
      CLAUDE_COWORK_HOST_BASH: "${CLAUDE_COWORK_HOST_BASH:-0}"
      # The Cowork VM's vsock port is fixed in the app and host-global, so only
      # one VM runs per host unless each instance moves to a port of its own.
      # Empty keeps the app's default (51234); accounts get a distinct port from
      # provision-user.sh. See docs/vsock-port.md.
      CLAUDESK_VM_VSOCK_PORT: "${CLAUDESK_VM_VSOCK_PORT:-}"
      CLAUDESK_VM_VSOCK_GUEST_SITES: "${CLAUDESK_VM_VSOCK_GUEST_SITES:-0}"
      COWORK_BRIDGE_ENABLED: "${COWORK_BRIDGE_ENABLED:-1}"
      COWORK_BRIDGE_INTERNAL_PORT: "${COWORK_BRIDGE_INTERNAL_PORT:-9222}"
      CLAUDE_REMOTE_GATEWAY_SETTINGS: "${CLAUDE_REMOTE_GATEWAY_SETTINGS:-0}"
      CLAUDE_REMOTE_DEVELOPER_ACTIONS: "${CLAUDE_REMOTE_DEVELOPER_ACTIONS:-0}"
      CLAUDE_REMOTE_INFRASTRUCTURE_ACTIONS: "${CLAUDE_REMOTE_INFRASTRUCTURE_ACTIONS:-0}"
      CLAUDE_REMOTE_CODE_ACTIONS: "${CLAUDE_REMOTE_CODE_ACTIONS:-1}"
      # One account's own instance (scripts/provision-user.sh). Read by the
      # container init as well as the bridge: a tenant's Code never runs in this
      # container, so the local Code surface is not written on either — see
      # docs/code-in-cowork-vm.md.
      CLAUDESK_TENANT: "${CLAUDESK_TENANT:-0}"
      # Read by the container init: on a tenant this flag (not the executor
      # flag) decides whether the Code surface exists at all. The bridge's own
      # service env carries the same value for the pool API and the VM-side
      # lookups. See docs/code-in-cowork-vm.md.
      CLAUDESK_CODE_RUNNERS: "${CLAUDESK_CODE_RUNNERS:-0}"
      # Read by the renderer preparer (cont-init) as well as the bridge: with the
      # web shell on it also splices the desktop Code route alias. See
      # docs/web-shell.md.
      CLAUDE_REMOTE_WEB_SHELL: "${CLAUDE_REMOTE_WEB_SHELL:-0}"
      # Read by the renderer preparer (cont-init). The prepared renderer is a pure
      # function of ion-dist plus the two flags above, so it is the same
      # generation in every container on the box: the deploy builds it once
      # (scripts/seed-renderer.sh) and mounts it read-only at the path below. A
      # container that finds its inputs unchanged adopts the seed instead of
      # parsing 113 MB of ion-dist, and one that finds it missing, stale or built
      # for other flags simply prepares its own — slower, never wrong.
      CLAUDESK_RENDERER_SEED: "/opt/claudesk-renderer-seed"
      # Route the Desktop main process's folder dialogs (Cowork's "Choose
      # folder" grant, which the native dialog cannot show on the headless
      # display) to the browser's in-page picker. Defaults on with the web shell.
      # See docs/web-shell.md, "Folder access".
      CLAUDE_REMOTE_FOLDER_PICKER: "${CLAUDE_REMOTE_FOLDER_PICKER:-}"
      # Answer the Desktop main process's "File Access Request" card itself. It
      # asks before a renderer may read a file outside the session's own folders
      # (an agent memory file, CLAUDE.md in the memory editor), and this
      # container has nobody at its display to answer it — the read, and the
      # browser's IPC call behind it, hangs forever. On by default; set 0 to keep
      # the native card. See docs/web-shell.md, "File access consent".
      CLAUDE_REMOTE_FILE_CONSENT: "${CLAUDE_REMOTE_FILE_CONSENT:-}"
      CLAUDE_GATEWAY_BASE_URL: "${CLAUDE_GATEWAY_BASE_URL:?Set CLAUDE_GATEWAY_BASE_URL in .env}"
      # Provisioned accounts set this so re-provisioning moves an endpoint that a
      # writable Gateway configuration already holds. See CLAUDE_GATEWAY_BASE_URL
      # in .env.example and rootfs/etc/cont-init.d/30-claude-config.sh.
      CLAUDE_GATEWAY_ENV_AUTHORITATIVE: "${CLAUDE_GATEWAY_ENV_AUTHORITATIVE:-0}"
      CLAUDE_GATEWAY_API_KEY: "${CLAUDE_GATEWAY_API_KEY:?Set CLAUDE_GATEWAY_API_KEY in .env}"
      CLAUDE_GATEWAY_AUTH_SCHEME: "${CLAUDE_GATEWAY_AUTH_SCHEME:-bearer}"
      CLAUDE_INFERENCE_MODELS_JSON: "${CLAUDE_INFERENCE_MODELS_JSON:-}"
      # Model Auto permission mode's safety classifier falls back to on this
      # gateway (exported as ANTHROPIC_DEFAULT_OPUS_MODEL by startapp.sh, and
      # carried into each account's Cowork VM by install-guest-runner.sh). A
      # model the gateway serves; empty keeps the built-in resolution. See
      # .env.example.
      CLAUDE_AUTO_MODE_MODEL: "${CLAUDE_AUTO_MODE_MODEL:-}"
      # Force Code's subagents onto a cheaper gateway route. Empty keeps Claude
      # Code's own resolution; see .env.example.
      CLAUDE_CODE_SUBAGENT_MODEL: "${CLAUDE_CODE_SUBAGENT_MODEL:-deepseek/deepseek-flash}"
      CLAUDE_CODE_SUBAGENT_MODEL_FORCE: "${CLAUDE_CODE_SUBAGENT_MODEL_FORCE:-1}"
    volumes:
      - ${CLAUDESK_DATA_ROOT:-/opt/claudesk/data}/config:/config
      - ${CLAUDESK_DATA_ROOT:-/opt/claudesk/data}/workspace:/workspace
      # Persistent root: the freshly built image is the read-only lower layer
      # and this host directory is the writable upper, so runtime package
      # installs and hand-edits survive a rebuild. See
      # persistent-root-entrypoint.sh.
      - ${CLAUDESK_ROOT_STATE:-/var/lib/claudesk-root}:/persistent-root
      - ./persistent-root-entrypoint.sh:/persistent-root-entrypoint.sh:ro
      # The generation scripts/seed-renderer.sh built for this release, shared by
      # every container on the box (see CLAUDESK_RENDERER_SEED above). Read-only:
      # a container only ever reads a seed, and a writable mount would let one
      # account's container hand another a generation.
      - ${CLAUDESK_RENDERER_SEED_DIR:-/opt/claudesk/data/renderer-seed}:/opt/claudesk-renderer-seed:ro
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/vhost-vsock:/dev/vhost-vsock
    group_add:
      - "${KVM_GID:-104}"
    # The overlay's mount(2) and pivot_root(2) need CAP_SYS_ADMIN, which the
    # base seccomp profile gates and the persistent variant unlocks (see README
    # "Security boundary"). userns_mode is host because the container re-roots
    # itself and Electron needs its own user namespace for the Chromium sandbox.
    cap_add:
      - SYS_ADMIN
    userns_mode: "host"
    security_opt:
      - "seccomp=./security/claude-desktop-persistent.json"
      - "apparmor=unconfined"
    entrypoint:
      - /persistent-root-entrypoint.sh
    command:
      - /init
    shm_size: "2gb"
    mem_limit: "${CLAUDE_DESKTOP_MEMORY_LIMIT:-3g}"
    networks:
      gateway_net:
        # A name only this instance answers to. A compose *service* name is
        # registered as a network alias by every stack that joins the network,
        # and gateway_net is shared with the box gateway and with each account's
        # instance, so a lookup of `claude-desktop` resolves to all of them.
        # Anything that must reach *this* Desktop — the mobile facade, the
        # reverse proxy — addresses this alias instead. The default keeps a
        # lone instance unique even with an empty CLAUDESK_NAME_PREFIX.
        # See docs/eva-mode.md, "Two deployments on one box".
        aliases:
          - "${CLAUDESK_NAME_PREFIX:-claudesk-}desktop"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pgrep -f '/usr/bin/claude-desktop|claude-desktop' >/dev/null
          && curl -fsS --max-time 5 http://127.0.0.1:${COWORK_BRIDGE_INTERNAL_PORT:-9222}/health >/dev/null
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  cowork-bridge:
    build:
      context: .
      dockerfile: bridge/Dockerfile
    image: local/claude-cowork-bridge:latest
    container_name: "${CLAUDESK_NAME_PREFIX:-}claude-cowork-bridge"
    # Browser uploads are written under /workspace and must be readable by the
    # Desktop/Code processes, which run as PUID:PGID.
    user: "${PUID:-1000}:${PGID:-1001}"
    network_mode: "service:claude-desktop"
    depends_on:
      claude-desktop:
        condition: service_healthy
        restart: true
      office-preview:
        condition: service_started
    environment:
      BRIDGE_HOST: "0.0.0.0"
      BRIDGE_PORT: "8080"
      COWORK_INTERNAL_URL: "http://127.0.0.1:${COWORK_BRIDGE_INTERNAL_PORT:-9222}"
      # The account's inference chain, for the runner inside its VM. The guest
      # cannot be assumed to reach the gateway directly — its egress is its own
      # allowlist — so the runner's model calls come through the bridge (the
      # address the guest provably reaches) and are forwarded here with the
      # account's own credentials. See docs/code-in-cowork-vm.md.
      CLAUDE_GATEWAY_BASE_URL: "${CLAUDE_GATEWAY_BASE_URL:-}"
      CLAUDE_GATEWAY_API_KEY: "${CLAUDE_GATEWAY_API_KEY:-}"
      CLAUDE_GATEWAY_AUTH_SCHEME: "${CLAUDE_GATEWAY_AUTH_SCHEME:-bearer}"
      CLAUDE_REMOTE_GATEWAY_SETTINGS: "${CLAUDE_REMOTE_GATEWAY_SETTINGS:-0}"
      CLAUDE_REMOTE_DEVELOPER_ACTIONS: "${CLAUDE_REMOTE_DEVELOPER_ACTIONS:-0}"
      CLAUDE_REMOTE_INFRASTRUCTURE_ACTIONS: "${CLAUDE_REMOTE_INFRASTRUCTURE_ACTIONS:-0}"
      CLAUDE_REMOTE_CODE_ACTIONS: "${CLAUDE_REMOTE_CODE_ACTIONS:-1}"
      # One account's own instance, provisioned by scripts/provision-user.sh (as
      # opposed to the deployment's own). A tenant never exposes the
      # container-local Code executor — its Code belongs on a self-hosted runner
      # inside its Cowork guest — so this withholds that surface whatever
      # CLAUDE_REMOTE_CODE_ACTIONS says. See docs/code-in-cowork-vm.md.
      CLAUDESK_TENANT: "${CLAUDESK_TENANT:-0}"
      # Application-layer auth for the bridge's own API. Every tenant joins the
      # shared gateway_net, so one account's container (or its VM, through
      # slirp) can reach another's bridge directly; the reverse proxy is not in
      # that path. A tenant always enforces it; the deployment's own instance
      # opts in with =1. The token is the mobile facade's server-to-server pass,
      # minted per instance by provision-user.sh / deploy.sh.
      CLAUDESK_BRIDGE_AUTH: "${CLAUDESK_BRIDGE_AUTH:-}"
      CLAUDESK_BRIDGE_TOKEN: "${CLAUDESK_BRIDGE_TOKEN:-}"
      # Answer the self-hosted pool API the runner speaks (bridge/code-runners.mjs).
      # Requires CLAUDESK_TENANT=1; off by default, so nothing is routed until the
      # deployment turns it on. The pool name is created on first use and a runner
      # registers against it with that pool's secret.
      CLAUDESK_CODE_RUNNERS: "${CLAUDESK_CODE_RUNNERS:-0}"
      CLAUDESK_CODE_RUNNER_POOL: "${CLAUDESK_CODE_RUNNER_POOL:-self-hosted}"
      # Experimental: render ion-dist's browser (claude.ai) chrome with the local
      # IPC data layer, and grant the org entitlements its Cowork surface checks.
      # See docs/web-shell.md. Off by default.
      CLAUDE_REMOTE_WEB_SHELL: "${CLAUDE_REMOTE_WEB_SHELL:-0}"
      # The login shell: this instance serves the renderer's own /login and
      # refuses the whole API, so it can never proxy the Desktop, hold a session
      # or run inference, signed in or not. Set it on the deployment's own
      # instance only, and point the proxy's pre-auth /login and /renderer/* at
      # that one. See docs/eva-mode.md, "The login shell". Off by default.
      CLAUDE_REMOTE_LOGIN_SHELL: "${CLAUDE_REMOTE_LOGIN_SHELL:-0}"
      # Display name for the signed-in user in the remote UI (the sidebar user
      # menu and the time-based home greeting). Empty keeps Desktop's own value.
      CLAUDE_REMOTE_USER_NAME: "${CLAUDE_REMOTE_USER_NAME:-}"
      # Web-shell account identity. When CLAUDE_REMOTE_WEB_SHELL is on, these
      # override the synthetic gateway identity (OS user + "Gateway") on the
      # account menu and sidebar footer, so the shell reads as a real account.
      # Each field is applied only when set; empty keeps the upstream value.
      # See docs/web-shell.md.
      CLAUDE_REMOTE_ACCOUNT_NAME: "${CLAUDE_REMOTE_ACCOUNT_NAME:-}"
      CLAUDE_REMOTE_ACCOUNT_EMAIL: "${CLAUDE_REMOTE_ACCOUNT_EMAIL:-}"
      CLAUDE_REMOTE_ACCOUNT_ORG: "${CLAUDE_REMOTE_ACCOUNT_ORG:-}"
      CLAUDE_REMOTE_ACCOUNT_PLAN: "${CLAUDE_REMOTE_ACCOUNT_PLAN:-}"
      CLAUDE_REMOTE_ACCOUNT_AVATAR: "${CLAUDE_REMOTE_ACCOUNT_AVATAR:-}"
      CLAUDE_REMOTE_DEPLOYMENT_NAME: "${CLAUDE_REMOTE_DEPLOYMENT_NAME:-}"
      # When set (e.g. http://authd:8080), the bridge resolves the signed-in
      # user from the auth service per request instead of the env identity, so
      # the sidebar/greeting read as that person. Empty keeps the env identity.
      AUTH_IDENTITY_URL: "${AUTH_IDENTITY_URL:-}"
      # This instance's name prefix, reported on /api/health so a peer can tell
      # whether the Desktop behind this bridge is its own instance's or another
      # one's (the mobile facade does that on startup). See docs/eva-mode.md.
      CLAUDESK_NAME_PREFIX: "${CLAUDESK_NAME_PREFIX:-}"
      # The pass for the admin dashboard's instance actions (VM restart/status).
      # Must match authd's AXTD_INTERNAL_SECRET; empty disables /internal/*.
      CLAUDESK_INTERNAL_SECRET: "${CLAUDESK_INTERNAL_SECRET:-}"
      # Routine schedules are interpreted in this timezone, as the Desktop's own
      # scheduler does. Without it the bridge would run in UTC.
      TZ: "${TZ:-Asia/Shanghai}"
      # Model the title generator is asked to use. Empty falls back to the
      # session's own model; set it to a cheap model the gateway serves.
      CLAUDE_TITLE_MODEL: "${CLAUDE_TITLE_MODEL:-}"
      COWORK_REMOTE_WORKSPACE_ROOT: "/workspace"
      # Extra roots (colon- or comma-separated) the authenticated remote
      # download route may serve from, on top of the always-allowed workspace.
      # Paths are resolved inside this container, so a host directory also
      # needs a bind mount above to exist here. Empty means /workspace only.
      COWORK_REMOTE_READ_ROOTS: "${COWORK_REMOTE_READ_ROOTS:-}"
      # Cowork session deliverables (the model's file cards) live here, under
      # Desktop's userData, and are readable by the download/preview routes;
      # empty keeps the built-in path.
      COWORK_REMOTE_SESSION_OUTPUTS_ROOT: "${COWORK_REMOTE_SESSION_OUTPUTS_ROOT:-}"
      # Largest file the bridge will hand the session file pane when Desktop's
      # own reader refuses it (Desktop caps at 10 MiB). Default 10485760.
      COWORK_REMOTE_SESSION_FILE_MAX_BYTES: "${COWORK_REMOTE_SESSION_FILE_MAX_BYTES:-10485760}"
      COWORK_UPLOAD_MAX_BYTES: "${COWORK_UPLOAD_MAX_BYTES:-1073741824}"
      # Office/PDF file preview: the pane's iframe asks the bridge, which streams
      # a PDF converted by the office-preview sidecar (sharing this network
      # namespace). Largest file the bridge will convert for preview; accepts a
      # K/M/G suffix. Default 52428800 (50 MiB), matching Desktop's own cap.
      CLAUDE_OFFICE_PREVIEW_URL: "http://127.0.0.1:8090"
      COWORK_REMOTE_PREVIEW_MAX_BYTES: "${COWORK_REMOTE_PREVIEW_MAX_BYTES:-52428800}"
      COWORK_REMOTE_ARTIFACTS_ROOT: "/config/Claude/Artifacts"
      COWORK_INTERNAL_FAILURE_EXIT_THRESHOLD: "${COWORK_INTERNAL_FAILURE_EXIT_THRESHOLD:-3}"
      CLAUDE_INFERENCE_MODELS_JSON: "${CLAUDE_INFERENCE_MODELS_JSON:-}"
      # The composer's model picker: an ordered list of model ids to keep at the
      # root of the model menu, with every other configured model under "More
      # models". A JSON array (as CLAUDE_INFERENCE_MODELS_JSON uses) or a
      # comma-separated list. With AUTH_IDENTITY_URL set, the admin page's
      # setting is what this reads and this is only the fallback; empty means the
      # native layout, every model at the root.
      CLAUDE_MODEL_PICKER_MAIN_MODELS: "${CLAUDE_MODEL_PICKER_MAIN_MODELS:-}"
      # Browser notifications: Web Push subscriptions, the VAPID key they are
      # bound to and the notification-preferences the settings panel writes, all
      # kept here so a restart does not drop every subscription. Contact address
      # push services see in the VAPID token (mailto: or https: URL).
      CLAUDE_REMOTE_PUSH_SUBJECT: "${CLAUDE_REMOTE_PUSH_SUBJECT:-mailto:claudesk@localhost}"
    volumes:
      - ${CLAUDESK_DATA_ROOT:-/opt/claudesk/data}/config:/config:ro
      - ${CLAUDESK_DATA_ROOT:-/opt/claudesk/data}/workspace:/workspace
      # Notifications state. Create it writable by PUID:PGID on the host (a
      # missing directory is created by Docker as root, which the bridge cannot
      # write to; it then only degrades to in-page notifications).
      - ${CLAUDESK_DATA_ROOT:-/opt/claudesk/data}/bridge-data:/data
    mem_limit: "${CLAUDE_COWORK_BRIDGE_MEMORY_LIMIT:-256m}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # The bridge holds after SIGTERM to warn connected pages before it exits
    # (CLAUDE_REMOTE_SHUTDOWN_NOTICE_MS, default 5s). Docker's 10s default would
    # usually cover it, but the hold must never be cut short by a SIGKILL.
    stop_grace_period: 20s
    restart: unless-stopped

  # Office/PDF preview converter. LibreOffice is the engine Desktop uses for the
  # same previews (it runs soffice in the Cowork VM). It is kept out of the
  # bridge so a heavy, occasionally crashy conversion cannot take down the
  # process that also serves Chat and Cowork IPC, and so the bridge keeps its
  # tight memory bound. It only ever receives bytes on a POST body and returns a
  # PDF — it has no access to /workspace or /config.
  office-preview:
    build:
      context: .
      dockerfile: bridge/office/Dockerfile
    image: local/claude-office-preview:latest
    container_name: "${CLAUDESK_NAME_PREFIX:-}claude-office-preview"
    # Shares the Desktop/bridge network namespace, so the bridge reaches it at
    # 127.0.0.1:8090 and it is never exposed on a host port.
    network_mode: "service:claude-desktop"
    depends_on:
      claude-desktop:
        condition: service_healthy
        restart: true
    environment:
      OFFICE_PREVIEW_HOST: "127.0.0.1"
      OFFICE_PREVIEW_PORT: "8090"
      OFFICE_PREVIEW_MAX_BYTES: "${COWORK_REMOTE_PREVIEW_MAX_BYTES:-52428800}"
    mem_limit: "${CLAUDE_OFFICE_PREVIEW_MEMORY_LIMIT:-1g}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  claude-mobile:
    build:
      context: .
      dockerfile: mobile/Dockerfile
    image: local/claude-mobile-api:latest
    container_name: "${CLAUDESK_NAME_PREFIX:-}claude-mobile-api"
    user: "${PUID:-1000}:${PGID:-1001}"
    ports:
      - "127.0.0.1:${CLAUDE_MOBILE_PORT:-8081}:8081"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      CLAUDE_MOBILE_HOST: "0.0.0.0"
      CLAUDE_MOBILE_PORT: "8081"
      CLAUDE_MOBILE_DATA_DIR: "/data"
      CLAUDE_MOBILE_API_EMAIL: "${CLAUDE_MOBILE_API_EMAIL:?Set CLAUDE_MOBILE_API_EMAIL in .env}"
      CLAUDE_MOBILE_API_TOTP_SECRET: "${CLAUDE_MOBILE_API_TOTP_SECRET:?Run node mobile/totp-setup.mjs and set CLAUDE_MOBILE_API_TOTP_SECRET in .env}"
      # Reverse proxies in front of this service (Caddy). The client address
      # is read from the matching X-Forwarded-For entry for the login lockout.
      CLAUDE_MOBILE_TRUST_PROXY: "${CLAUDE_MOBILE_TRUST_PROXY:-1}"
      CLAUDE_MOBILE_API_MAX_FAILURES: "${CLAUDE_MOBILE_API_MAX_FAILURES:-5}"
      CLAUDE_MOBILE_API_BASE_BAN_SECONDS: "${CLAUDE_MOBILE_API_BASE_BAN_SECONDS:-600}"
      # Chats, models, uploads and tools all go through Claudesk (the bridge in
      # front of Claude Desktop); this service no longer talks to the gateway.
      # The host is this instance's own alias for its Desktop, not the service
      # name `claude-desktop` — on a host running more than one instance that
      # name resolves to every instance's Desktop, and the facade would drive
      # whichever one it happened to connect to. See docs/eva-mode.md.
      CLAUDE_MOBILE_DESKTOP_HOST: "${CLAUDESK_NAME_PREFIX:-claudesk-}desktop"
      # Dial this URL instead of the host above. Empty means the host.
      CLAUDE_MOBILE_DESKTOP_URL: "${CLAUDE_MOBILE_DESKTOP_URL:-}"
      # The bridge's server-to-server pass (see CLAUDESK_BRIDGE_AUTH there).
      # Required when the bridge gates its API; provision-user.sh mints it.
      CLAUDESK_BRIDGE_TOKEN: "${CLAUDESK_BRIDGE_TOKEN:-}"
      # Our own prefix, compared against the bridge's on startup: a mismatch
      # means this facade is driving a Desktop that is not its instance's, which
      # is reported instead of served. See mobile/server.mjs.
      CLAUDESK_NAME_PREFIX: "${CLAUDESK_NAME_PREFIX:-}"
      CLAUDE_MOBILE_CAPTURE: "${CLAUDE_MOBILE_CAPTURE:-0}"
      CLAUDE_MOBILE_TOOL_BLOCKS: "${CLAUDE_MOBILE_TOOL_BLOCKS:-1}"
      CLAUDE_MOBILE_THINKING: "${CLAUDE_MOBILE_THINKING:-1}"
      CLAUDE_MOBILE_TITLES: "${CLAUDE_MOBILE_TITLES:-1}"
      # Model the title generator is asked to use. Empty falls back to the
      # session's own model; set it to a cheap model the gateway serves.
      CLAUDE_TITLE_MODEL: "${CLAUDE_TITLE_MODEL:-}"
      CLAUDE_MOBILE_PLAN: "${CLAUDE_MOBILE_PLAN:-max_20x}"
      # One-shot experiment switch for the new-session environment picker:
      # "both" (default) advertises the cloud record and the bridge record;
      # "cloud-only" withholds the bridge so the picker has only the cloud row
      # to offer. Lets one picker open on device tell apart "the picker never
      # surfaces the cloud row" from "it surfaces and then auto-selects/drops
      # it". Unset in normal operation.
      CLAUDE_MOBILE_ENVIRONMENT_MODE: "${CLAUDE_MOBILE_ENVIRONMENT_MODE:-both}"
      # Second half of the same experiment: with the bridge withheld from the
      # list the app still resolves it by id (state persisted on the phone), so
      # setting this to 1 also 404s that by-id read. If the picker then offers
      # the cloud row, the saved bridge id was pinning it.
      CLAUDE_MOBILE_EXPERIMENT_HIDE_BRIDGE_BY_ID: "${CLAUDE_MOBILE_EXPERIMENT_HIDE_BRIDGE_BY_ID:-0}"
      # Shared secret for the on-device Frida probe's findings sink
      # (POST /__diag, see tools/frida/). The route does not exist unless this
      # is set, and it is reached before the login gate so a sideloaded build
      # can report without a session.
      CLAUDE_MOBILE_FRIDA_TOKEN: "${CLAUDE_MOBILE_FRIDA_TOKEN:-}"
    depends_on:
      cowork-bridge:
        condition: service_healthy
    volumes:
      # Login sessions and lockout state, mobile-only chat metadata, uploads, and
      # conversations from before the Claudesk backend (legacy-conversations/).
      - ${CLAUDESK_DATA_ROOT:-/opt/claudesk/data}/mobile-data:/data
    mem_limit: "${CLAUDE_MOBILE_API_MEMORY_LIMIT:-256m}"
    networks:
      gateway_net:
        # This instance's own name for the phone's ingress, beside the shared
        # `claude-mobile` service alias (see the note on claude-desktop above).
        aliases:
          - "${CLAUDESK_NAME_PREFIX:-claudesk-}mobile"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Expose the box-level gateway (compose.gateway.yaml) on port 4000 inside this
  # deployment's Desktop / mobile network namespaces. The `gateway` service lives
  # in that shared chain, not here, so there is deliberately no depends_on for it.
  #
  # It listens on every interface of the namespace, not just the loopback. The
  # Cowork VM makes the model calls and can only leave the guest through the
  # host, where it arrives on the host-facing address QEMU's networking gives it
  # — not on the container's own 127.0.0.1. A loopback-only bind answers the
  # container's own processes and nothing the VM can dial, which is why
  # inference failed inside the VM while the same port answered from the
  # container. Peers that can reach this relay on gateway_net could already
  # reach caddy `gateway` on that port, so the wider bind exposes nothing new.
  claude-gateway-loopback:
    image: alpine/socat
    container_name: "${CLAUDESK_NAME_PREFIX:-}claude-gateway-loopback"
    restart: unless-stopped
    network_mode: "service:claude-desktop"
    depends_on:
      - claude-desktop
    command:
      - "TCP-LISTEN:4000,reuseaddr,fork"
      - "TCP:gateway:4000"

  claude-mobile-gateway-loopback:
    image: alpine/socat
    container_name: "${CLAUDESK_NAME_PREFIX:-}claude-mobile-gateway-loopback"
    restart: unless-stopped
    network_mode: "service:claude-mobile"
    depends_on:
      - claude-mobile
    command:
      - "TCP-LISTEN:4000,bind=127.0.0.1,reuseaddr,fork"
      - "TCP:gateway:4000"

  # Authentication and account service. Owns users, sessions and invites, serves
  # the login/admin SPA, and answers the reverse proxy's `forward_auth`. A plain
  # component: it never touches a container runtime.
  authd:
    build:
      context: .
      dockerfile: auth/Dockerfile
    image: local/claudesk-authd:latest
    container_name: "${CLAUDESK_NAME_PREFIX:-}claude-authd"
    user: "${PUID:-1000}:${PGID:-1001}"
    ports:
      - "127.0.0.1:${AUTH_PORT:-15830}:8080"
    environment:
      AXTD_BIND: "0.0.0.0:8080"
      AXTD_DB: "/data/auth.db"
      AXTD_WEB_DIR: "/app/web"
      # A Secure cookie needs the HTTPS entry; the reverse proxy terminates TLS.
      AXTD_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-1}"
      # Number of trusted reverse proxies (Caddy), as with the mobile service.
      AXTD_TRUST_PROXY: "${AUTH_TRUST_PROXY:-1}"
      AXTD_SESSION_TTL_DAYS: "${AUTH_SESSION_TTL_DAYS:-30}"
      AXTD_INVITE_TTL_HOURS: "${AUTH_INVITE_TTL_HOURS:-72}"
      # First admin, created at startup if no admin exists; its one-time invite
      # link is printed to the log (docker compose logs claude-authd).
      AXTD_BOOTSTRAP_ADMIN_EMAIL: "${AUTH_BOOTSTRAP_ADMIN_EMAIL:-}"
      # Spool the host reconciler's systemd .path unit watches. authd drops a
      # request file here when an account needs an instance, so it is created on
      # the event; the installer derives the same path from CLAUDESK_DATA_ROOT.
      AXTD_PROVISION_SPOOL: "${AXTD_PROVISION_SPOOL:-/data/provision-requests}"
      # The mirror for deletions: when an admin deletes an account, authd drops a
      # request here carrying the account's email/upstream, so the host can tear
      # down its instance and data root. Same mount, so it is created on the event
      # and survives a restart. The installer derives the path from
      # CLAUDESK_DATA_ROOT the same way it does the provision spool.
      AXTD_DEPROVISION_SPOOL: "${AXTD_DEPROVISION_SPOOL:-/data/deprovision-requests}"
      # The VM-apply spool. An admin's Apply drops the account's email here; the
      # host reconciler re-runs provision-user.sh, which reads the desired specs
      # back out of this database and recreates the instance. See
      # scripts/converge-vm-applies.sh.
      AXTD_VM_APPLY_SPOOL: "${AXTD_VM_APPLY_SPOOL:-/data/vm-apply-requests}"
      # Shared secret for the instance actions the admin dashboard performs
      # (VM restart/status). authd calls the account's bridge over gateway_net;
      # empty disables those routes rather than leaving VM control open.
      AXTD_INTERNAL_SECRET: "${CLAUDESK_INTERNAL_SECRET:-}"
      # Shared secret for the internal gateway route that resolves an account's
      # gateway key to its own upstream key. Must match shitproxy's
      # GATEWAY_RESOLVER_SECRET (in /etc/shitproxy/gateway.env). Empty disables
      # the route (404), leaving per-user keys off.
      AXTD_GATEWAY_SECRET: "${AUTH_GATEWAY_SECRET:-}"
    volumes:
      # SQLite database. Create it writable by PUID:PGID on the host.
      - ${CLAUDESK_DATA_ROOT:-/opt/claudesk/data}/auth-data:/data
    mem_limit: "${AUTH_MEMORY_LIMIT:-128m}"
    networks:
      - gateway_net
    healthcheck:
      test:
        - CMD
        - /app/authd
        - --healthcheck
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    # authd installs no SIGTERM handler and runs as PID 1, so the kernel does not
    # apply the default terminate disposition and the signal is ignored outright.
    # Docker would wait out its whole default grace — 10s — before killing it,
    # and that wait is most of the outage every recreate costs: the reverse proxy
    # calls this service's forward_auth on every request, so while it is gone
    # every tab on every account gets a 502. Safe to cut short because the
    # database is SQLite in WAL mode with a 5s busy timeout, so a kill mid-write
    # recovers on the next open.
    stop_grace_period: 3s
    restart: unless-stopped

networks:
  gateway_net:
    external: true
