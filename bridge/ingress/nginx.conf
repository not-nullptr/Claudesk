# The only lane authd gets into an account's bridge.
#
# authd dials `<prefix>desktop:8080` for the admin dashboard's VM restart and
# status. That name is an alias of this container on the control network, not
# of the Desktop. The bridge's /internal/* handlers authenticate the call with
# CLAUDESK_INTERNAL_SECRET; everything outside /internal/ is refused here so a
# peer on the control network cannot reach the account's API.
#
# proxy_pass uses a variable so Docker's DNS is consulted per request: the
# Desktop is recreated on its own sometimes, and nginx would otherwise pin the
# address it resolved at startup.
server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /internal/ {
        set $claudesk_bridge claude-desktop:8080;
        proxy_pass http://$claudesk_bridge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;
    }

    location / {
        return 404;
    }
}
